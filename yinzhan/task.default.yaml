      -
        key: '4-1'
        title: '本命综合结论'
        status: 'pending'
        description:
          analyst: |-
            执行本步：本命综合结论。基于已完成的全部基线步骤，在一份报告里完成以下四部分，产出 workspace/steps/natal/summary.md：
            1. **四大目标结论 (Purusharthas)**：Dharma（10宫/土星）、Artha（2/11宫）、Kama（7宫/金星/火星）、Moksha（4/8/12宫/Ketu），直接回答用户核心关切，结论必须由前序分析推导而来。
            2. **补救与建议 (Upayas)**：用一句话总结命主人生剧本（灵魂蓝图）；给出 Mantra/Ratna/Lifestyle 三类补救（仅增强有利行星），必须包含"自由意志"与"非医疗建议"免责声明。
            3. **风险清单**：只写缺点、盲点、反模式与高风险点，用"触发条件 → 典型表现 → 具体代价"格式，覆盖至少 6 个领域，标注哪些风险与后续时间片触发有关。
            4. **前事验证问题清单**：把待验证点改写成用户可回答的问题，优先整理时间窗口验证题，再补结构性验证题，并给出下一轮最值得追问的方向。
