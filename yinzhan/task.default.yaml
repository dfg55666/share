            4. 只分析本 AD 内有信号的领域，其余领域简述或跳过（须给出理由）。
            5. 多维时间验证统一按 `workspace/prompts/timeline/ad_prompt.md`、`workspace/prompts/shared/jhora_usage_guide.md` 与 `workspace/prompts/shared/jyotish_theory_protocol.md` 执行；本 task 模板不重复定义 Transit、BAV/SAV、Tajaka 或 Yoga 显化算法。
            6. 禁止在本步展开 PD 层内容（PD 有独立步骤 `7-x-y-0`）。
