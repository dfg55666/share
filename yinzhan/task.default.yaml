            以模式 B 审查 writer 产出的 workspace/steps/timeline/{md-key}/ad_{ad-key}.writer.md，对照原稿 workspace/steps/timeline/{md-key}/ad_{ad-key}.md。
            本步差异化关注（AD 分析专项）：
