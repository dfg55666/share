               - `career`：事业与成就（提示词：workspace/prompts/modules/career.md）
               - `wealth`：财富与资产（提示词：workspace/prompts/modules/wealth.md）
               - `love`：情感婚姻（提示词：workspace/prompts/modules/love.md）
               - `health`：健康精力（提示词：workspace/prompts/modules/health.md）
               - `children`：子女主题（提示词：workspace/prompts/modules/children.md）
               - `spirituality`：灵性成长（提示词：workspace/prompts/modules/spirituality.md）
               - `family`：家庭根基（提示词：workspace/prompts/modules/family.md）
               - `education`：学业成长（提示词：workspace/prompts/modules/education.md）
               - `risks`：风险预警（提示词：workspace/prompts/modules/risks.md）
            3. 基于用户关切、盘面波幅与前序收敛输出，自主决定本轮保留哪些模块、裁剪哪些模块，以及各保留模块的执行顺序。
            4. **通过 `task_update` 更新任务流**：删除占位 `6-1`，在 `6-0` 之后插入第一个保留模块；若有更多模块，在其后继续插入 `6-2`、`6-3` ... 的同类模块步骤；未保留模块不写入任务流。
            5. 将保留模块、裁剪模块、顺序、理由，以及每个保留模块对应的提示词路径与产物路径写入对应步骤的 description 中。
            6. 本步只负责路由、排序与本命模块子任务树规划，禁止展开任何具体模块分析内容。
            本步无需产出额外文件，`task_update` 对任务流的更新即为本步产物。
          checker: |-
            审核 analyst 的本步输出，检查项：
            - 是否明确列出可选模块中的保留结果、裁剪结果及其理由？
            - 是否真的通过 `task_update` 将占位 `6-1` 替换为首个模块并按需插入更多 6-x？
            - 更新后的任务步骤 description 中是否写明各保留模块的顺序、提示词路径与产物路径？
            - 是否把具体模块分析内容错误地提前展开到 6-0？
      -
        key: '6-1'
        title: '{本命模块名} 分析（占位，由 6-0 动态替换）'
        status: 'pending'
        description:
          analyst: |-
            本步为本命模块占位步骤，由 6-0 根据路由结果替换为具体模块分析任务（如“事业与成就模块”或“财富与资产模块”）。
            **执行时**：
            1. 调用 `task_read(view="context", agent="analyst")` 确认当前模块的名称、提示词路径、产物路径与优先级。
            2. 读取对应模块提示词（`workspace/prompts/modules/{module-prompt}.md`）与已完成基线/综合步骤，确认当前模块的展开边界。
            3. 在当前模块边界内完成本命领域分析；若发现跨模块结论，仅做 Cross-Link，不在本步展开其他模块。
            4. 本步只处理当前模块，禁止回退成总控或提前展开其他本命模块。
            产出 workspace/steps/natal/modules/{module-key}.md。
          checker: |-
            审核 analyst 的本步输出，检查项：
