current_step: 'round1-1-1-analyst'
rounds:
  -
    round: 'round1'
    steps:
      -
        key: '1-1'
        title: '数据校验 + Panchanga时空底色 + 上升与月亮深度分析'
        status: 'pending'
        description:
          analyst: |-
            执行本步：数据校验 + Panchanga时空底色 + 上升与月亮深度分析。
            前置校验（Preamble）：
            - 确认采用 Sidereal Zodiac (Lahiri Ayanamsa)。
            - 列出 Lagna (上升点)、Moon Sign (月亮星座)、Sun Sign (太阳星座)。
            - 查询 `panchanga`，列出 Tithi（月相太阴日）、Yoga 以及 Hora Lord，并明确指出这些时空底色对盘面基础能量的影响（例如避开恶月相、空亡日等）。
            - 扫描 `special_points`，检查特殊计算点与煞星（如 Mandi、Gulika）是否严重污染了上升和月亮。
            - 列出月亮所在的 Nakshatra (二十七星宿) 及其 Pada (脚)。
            - 确认 D1 与 D9 上升点数据无误；声明缺失项（若有）。
            - 本段仅做数据映射校验，不输出事件预测。
            Lagna (肉身与面具)：分析命主星 (Lagna Lord) 的状态 (入庙/旺/陷/敌) 及落宫，评估体质与外在气质。
            Moon (心智与感知)：
            - 深度剖析月亮 Nakshatra 的神话隐喻与潜意识模式。
            - 月相与光亮：分析这是满月 (Purnima) 还是新月 (Amavasya)，判断心性能量的强弱。
            - 孤独/夹持：检查是否有 Kemadruma Yoga (孤月) 或吉星夹持。
            D1与D9联动：对比月亮在D9中的位置 (Navamsa Moon)，看内心真实的情感需求。
            完成后产出 workspace/steps/1-1/analyst.md。
          checker: |-
            执行通用技术审查基线（checker_prompt §4），叠加以下专项检查：
            - 是否在前置段落确认了体系(Sidereal/Lahiri)、列出 Lagna/Moon/Sun 及 Nakshatra/Pada？
            - 是否确认了 D1 与 D9 上升点数据无误？
            - 前置校验段是否避免了事件预测与吉凶断语？
            - 是否分析了 `panchanga`（如 Tithi/Yoga）的时空底色，并运用 `special_points` 检查了煞星(Mandi/Gulika)的污染？
            - 是否分析了 Lagna Lord 的强弱（不仅星座，还包含相位/宫位）？
            - 是否结合 Nakshatra 分析了月亮的心智模式？
            - 是否避免无边界绝对化断语？
            将审核结论写入 workspace/steps/1-1/checker.md。
          writer: |-
            基于已通过的 analyst 输出与 checker 结论，整理面向用户的可读稿。
            本步润色重点：让用户了解自己的基础性格画像——这是全篇定调的段落，语气温和、有亲和力。
            去术语化重点：Nakshatra、Pada、Lagna Lord、Kemadruma 等基础术语需全部转化为直觉可感知的性格描述。
            产出 workspace/steps/1-1/writer.md。
          checker_review: |-
            以模式 B 审查 writer 产出的 workspace/steps/1-1/writer.md，对照原稿 workspace/steps/1-1/analyst.md。
            本步差异化关注：
            - 基础性格画像是否完整保留（Lagna 气质 + Moon 心智模式）？
            - Panchanga 时空底色是否被省略或错误简化？
            - 前置校验段不应被润色师改写为带有吉凶判断的叙事。
      -
        key: '2-1'
        title: '行星状态、交战与灵魂意志'
        status: 'pending'
        description:
          analyst: |-
            执行本步：行星状态、交战与灵魂意志 (Sun & Planets)。
            - Sun (灵魂与意志)：分析太阳落位，揭示父系业力及灵魂终极追求。
            - 行星多维评估 (量化升级)：
              - 禁止仅凭 Exaltation (耀升) / Debilitation (落陷) 下定论，必须结合 `vimsopaka` 与 `shadbala` 确认星体真实力量。
              - 强制检查 `avasthas`，明确星体是清醒活跃还是老死沉睡。
              - 强制检查 `combustion.orb` (燃烧容许度) 及 `war` (星体交战)。必须明确交战的胜负，果断降级败者的力量与影响。
            - Jaimini 指标：不仅要确定 Atmakaraka (灵魂指示星/AK)，还必须标出 Amatyakaraka (AmK/事业星) 和 Darakaraka (DK/伴侣星)，为后续领域分析定位。
            完成后产出 workspace/steps/2-1/analyst.md。
          checker: |-
            执行通用技术审查基线（checker_prompt §4），叠加以下专项检查：
            - 是否涵盖了全部九大星体（Nine Grahas，包含 Rahu/Ketu）？
            - 是否通过 Shadbala / Vimsopaka / Avasthas 验证了星体的真实力量（而非只看庙旺落陷表面）？
            - 是否检查了星体交战（war.winner/loser），并剔除了交战败者的利好论断？
            - 是否找出了 8 个 Chara Karakas 中的关键星（AK/AmK/DK）而不仅是 AK？
            将审核结论写入 workspace/steps/2-1/checker.md。
          writer: |-
            基于已通过的 analyst 输出与 checker 结论，整理面向用户的可读稿。
            本步润色重点：大量 Shadbala/Vimsopaka/Avastha 等量化术语需转化为直觉可感知的力量描述（如"这颗星精力充沛"vs"这颗星像个打了瞌睡的老人"）。
            去术语化重点：行星交战、焦伤、Chara Karaka 等概念需用现实比喻替代。
            语气要求：客观描述各星体特质，避免单纯罗列好坏。
            产出 workspace/steps/2-1/writer.md。
          checker_review: |-
            以模式 B 审查 writer 产出的 workspace/steps/2-1/writer.md，对照原稿 workspace/steps/2-1/analyst.md。
            本步差异化关注：
            - 行星力量的强弱定性是否与原稿一致（原稿"交战失败"不能润色成"稍有不足"）？
            - AK/AmK/DK 三个灵魂指标的现实映射是否保留？
            - 量化分值虽然不出现在口语稿，但力量高低的判断方向不能反转。
      -
        key: '2-2'
        title: '罗睺-计都业力轴线'
        status: 'pending'
        description:
          analyst: |-
            执行本步：罗睺-计都业力轴线 (Rahu-Ketu Axis)。
            业力透视：
            - Rahu (北交点)：揭示缘主今生极度渴望、执着甚至产生幻觉的领域 (陌生的水域)。
            - Ketu (南交点)：揭示缘主前世修习圆满、今生厌离或具有先天灵性的领域 (熟悉的港湾)。
            轴线张力：分析这对矛盾（如 1/7 轴自我与伴侣，4/10 轴家庭与事业）如何撕扯缘主的人生，并指出平衡之道。
            完成后产出 workspace/steps/2-2/analyst.md。
          checker: |-
            执行通用技术审查基线（checker_prompt §4），叠加以下专项检查：
            - 是否正确区分了 Rahu 的"渴望/执着/幻觉"与 Ketu 的"厌离/先天/放下"——二者不可混淆？
            - 轴线张力分析是否给出了现实事件级的冲突描述（而非仅停留在抽象的"能量拉扯"）？
            - 是否将 Rahu/Ketu 与 Nakshatra Pada 结合分析（共享理论协议 §10 要求 Pada 贯穿全流程）？
            - 是否避免了将 Rahu/Ketu 简单标签化为纯凶/纯吉？
            将审核结论写入 workspace/steps/2-2/checker.md。
          writer: |-
            基于已通过的 analyst 输出与 checker 结论，整理面向用户的可读稿。
            本步润色重点：Rahu-Ketu 轴线是全篇最"哲理"的部分，要用生动的现实场景（如"你疯狂追求事业成就，却内心深处最渴望家庭温暖"）替代抽象的业力描述。
            去术语化重点：北交点/南交点、业力轴线等概念需完全转化。
            语气要求：可以稍带诗意，但核心是让用户认出自己的内心矛盾。
            产出 workspace/steps/2-2/writer.md。
          checker_review: |-
            以模式 B 审查 writer 产出的 workspace/steps/2-2/writer.md，对照原稿 workspace/steps/2-2/analyst.md。
            本步差异化关注：
            - Rahu（渴望）与 Ketu（厌离）的对立方向是否保留完整？
            - 轴线冲突的现实表现是否与原稿一致，未被诗意化到失真？
            - "平衡之道"建议是否保持了原稿的操作性？
      -
        key: '2-3'
        title: '核心格局、宫位互动与显化'
        status: 'pending'
        description:
          analyst: |-
            执行本步：核心格局、宫位互动与显化 (Yogas & Manifestation)。
            - 复合敌友检验：在分析星体落宫、同宫互动或相位（Drishti）时，强制查询 `relationships.compound`（复合敌友关系），判断其表面吉凶背后是否隐藏天然敌对。
            - 识别天命格局：
              - Raja Yoga (帝王/权势)、Dhana Yoga (财富)、Sanyasa Yoga (苦行/出世)。
              - Pancha Mahapurusha Yoga (五大人格瑜伽)。
            - 显化分析：不仅列出名字，更要解释该格局在现实生活中的具体显化形式（是富而不贵？是有名无实？还是先苦后甜？）。参考 D9 确认格局的"果实"是否饱满。
            完成后产出 workspace/steps/2-3/analyst.md。
          checker: |-
            执行通用技术审查基线（checker_prompt §4），叠加以下专项检查：
            - 是否运用了 Arudha Lagna (AL) 视角？
            - 相位分析是否包含 Jaimini 符号相位（若适用）？
            - 凶宫（6/8/12）是否做了辩证分析（非纯粹负面）？
            - 提出的 Yoga 是否有明确构成条件说明？
            - 是否评估了 Yoga 的强弱（而非见 Yoga 就断吉）？
            - 是否调用了 `jhora_yoga` 工具进行 Yoga 枚举？若仅凭记忆列举 Yoga 而未核验 → 提示补充。
            将审核结论写入 workspace/steps/2-3/checker.md。
          writer: |-
            基于已通过的 analyst 输出与 checker 结论，整理面向用户的可读稿。
            本步润色重点：Yoga 格局名称（Raja Yoga、Dhana Yoga 等）需全部转化为现实场景描述（如"你的盘面里藏着一个'权力阶梯'结构"）。
            去术语化重点：Yoga 名称、Pancha Mahapurusha、Arudha Lagna、Drishti 等全部需要口语化。
            语气要求：重点传达格局的"现实显化形式"——是什么样的人生剧本，不是什么Yoga名字。
            产出 workspace/steps/2-3/writer.md。
          checker_review: |-
            以模式 B 审查 writer 产出的 workspace/steps/2-3/writer.md，对照原稿 workspace/steps/2-3/analyst.md。
            本步差异化关注：
            - Yoga 的强弱判定是否保留（原稿说"有但弱"不能润色成"大有可为"）？
            - 显化分析的具体形式是否完整传达？
            - 凶宫的辩证面（非纯负面）是否在口语稿中有体现？
      -
        key: '3-1'
        title: 'Navamsa (D9) 深度解码'
        status: 'pending'
        description:
          analyst: |-
            执行本步：Navamsa (D9) 深度解码。
            - 果实之盘：D9 是 D1 的果实。分析 D9 Lagna 及命主星。
            - 后半生指引：D9 揭示了中晚年的归宿与真实的内在力量。
            - 婚恋本质：必须分析 D9 中的婚恋情况。D1 虽好 D9 差，则金玉其外败絮其中。
            - 灵魂渴望：分析 Karakamsha Lagna (AK在D9的落宫) 的精神追求。
            完成后产出 workspace/steps/3-1/analyst.md。
          checker: |-
            执行通用技术审查基线（checker_prompt §4），叠加以下专项检查：
            - 是否对比了行星在 D1 与 D9 的状态变化（Vargottama 等）？
            - 是否分析了 Karakamsha 及其灵魂层影响？
            - 是否涉及婚姻/伴侣的深层业力？
            - D9 分析是否遵守了 shared 理论协议 §12 的 Vargas 用途边界（D9=婚姻/内在果实）？
            将审核结论写入 workspace/steps/3-1/checker.md。
          writer: |-
            基于已通过的 analyst 输出与 checker 结论，整理面向用户的可读稿。
            本步润色重点：D9 作为"果实之盘"的概念需用直白的话解释（如"你外在的努力最终结出什么果"）。
            去术语化重点：Navamsa、Vargottama、Karakamsha 等必须完全转化。
            语气要求：涉及婚恋本质和后半生走向，语气可以稍显沉稳，但保持温暖。
            产出 workspace/steps/3-1/writer.md。
          checker_review: |-
            以模式 B 审查 writer 产出的 workspace/steps/3-1/writer.md，对照原稿 workspace/steps/3-1/analyst.md。
            本步差异化关注：
            - "D1 好 D9 差"的落差判断是否保留（不能润色成"总体还行"）？
            - 婚恋本质的深层分析是否完整传达？
            - Karakamsha 的灵魂追求是否用口语化方式保留？
      -
        key: '3-2'
        title: '分盘与特殊业力 (Vargas & Doshas)'
        status: 'pending'
        description:
          analyst: |-
            执行本步：分盘与特殊业力 (Vargas & Doshas)。
            - 领域聚焦：根据用户需求，简述 D10 (事业/天职) 或 D2 (财富积累)。
            - 业力缺陷 (Dosha)：检查 Kaal Sarpa (蛇煞), Mangal Dosha (火星刑克), Pitra Dosha (祖先业力) 等，并解释其对人生的具体考验。
            完成后产出 workspace/steps/3-2/analyst.md。
          checker: |-
            执行通用技术审查基线（checker_prompt §4），叠加以下专项检查：
            - 是否针对特定领域使用了正确分盘（如事业看 D10）？
            - Dosha 分析是否给出成立/缓解条件说明？
            - 是否引用 Shadbala 或 Ashtakavarga 作为量化支持？
            - Dosha 判定是否同时检查了取消条件（如 Mangal Dosha 的 cancellation rules）？
            将审核结论写入 workspace/steps/3-2/checker.md。
          writer: |-
            基于已通过的 analyst 输出与 checker 结论，整理面向用户的可读稿。
            本步润色重点：Dosha（业力缺陷）是最容易吓到用户的部分，必须准确传达"这是考验不是判刑"的态度。
            去术语化重点：Kaal Sarpa、Mangal Dosha、Pitra Dosha 等需转化为现实描述（如"你的感情路上自带一个'先磨合再甜蜜'的模式"）。
            语气要求：直白但不恐吓，重点传达考验的具体表现和应对方向。
            产出 workspace/steps/3-2/writer.md。
          checker_review: |-
            以模式 B 审查 writer 产出的 workspace/steps/3-2/writer.md，对照原稿 workspace/steps/3-2/analyst.md。
            本步差异化关注：
            - Dosha 的严重程度定性是否与原稿一致（原稿"成立且无缓解"不能润色成"小小考验"）？
            - 缓解条件是否保留传达？
            - 是否避免了恐吓性措辞（同时也没有过度轻描淡写）？
      -
        key: '3-3'
        title: 'Jaimini 灵魂架构与 Ashtakavarga 宫气分值'
        status: 'pending'
        description:
          analyst: |-
            执行本步：Jaimini 灵魂架构与 Ashtakavarga 宫气分值。
            - Jaimini 进阶联动：综合上述分析，总结 AK (灵魂)、AmK (事业)、DK (伴侣) 等核心 Karakas 在 D1 和 D9 中的深层联动指引。
            - Ashtakavarga 扫描：强制查阅 D-1 盘的 SAV (八字分值) 总分，明确点出得分极高（天然顺遂）与得分极低（天然黑洞）的宫位，定下该人生的"天花板"与"薄弱区"。
            完成后产出 workspace/steps/3-3/analyst.md。
          checker: |-
            执行通用技术审查基线（checker_prompt §4），叠加以下专项检查：
            - SAV 是否使用了 D1 主盘数据（BAV/SAV 严禁用于 Vargas，遵守共享理论协议 §12）？
            - 是否标注了极高（≥30）和极低（≤22）的宫位？
            - Jaimini Karaka 联动是否与 2-1 步骤的 AK/AmK/DK 定位一致？若存在矛盾须指出。
            - SAV 数据是否通过 jhora 工具获取，而非凭经验估算？
            将审核结论写入 workspace/steps/3-3/checker.md。
          writer: |-
            基于已通过的 analyst 输出与 checker 结论，整理面向用户的可读稿。
            本步润色重点：SAV 分值的"天花板"与"薄弱区"概念要用生活化的比喻（如"你的事业区域天生有一片肥沃土壤，但感情区域的地质条件比较贫瘠"）。
            去术语化重点：Ashtakavarga、SAV、Chara Karaka、Karakamsha 等全部需要转化。
            语气要求：为全篇基线分析收尾，语气可以稍显总结性，但不要变成公文式"综上所述"。
            产出 workspace/steps/3-3/writer.md。
          checker_review: |-
            以模式 B 审查 writer 产出的 workspace/steps/3-3/writer.md，对照原稿 workspace/steps/3-3/analyst.md。
            本步差异化关注：
            - SAV 分值的高低判断方向是否保留（原稿"极低"不能润色成"还行"）？
            - Jaimini 三个灵魂指标（AK/AmK/DK）的现实映射是否完整？
            - 天花板与薄弱区的对比是否清晰传达？
      -
        key: '4-1'
        title: '本命综合结论'
        status: 'pending'
        description:
          analyst: |-
            执行本步：本命综合结论。基于已完成的全部基线步骤，在一份报告里完成以下四部分，产出 workspace/steps/natal/summary.md：
            1. **四大目标结论 (Purusharthas)**：Dharma（10宫/土星）、Artha（2/11宫）、Kama（7宫/金星/火星）、Moksha（4/8/12宫/Ketu），直接回答用户核心关切，结论必须由前序分析推导而来。
            2. **补救与建议 (Upayas)**：用一句话总结命主人生剧本（灵魂蓝图）；给出 Mantra/Ratna/Lifestyle 三类补救（仅增强有利行星），必须包含"自由意志"与"非医疗建议"免责声明。
            3. **风险清单**：只写缺点、盲点、反模式与高风险点，用"触发条件 → 典型表现 → 具体代价"格式，覆盖至少 6 个领域，标注哪些风险与后续时间片触发有关。
            4. **前事验证问题清单**：把待验证点改写成用户可回答的问题，优先整理时间窗口验证题，再补结构性验证题，并给出下一轮最值得追问的方向。
          checker: |-
            执行通用技术审查基线（checker_prompt §4），叠加以下专项检查：
            - 四大目标结论是否直接回答用户关切且逻辑来自前序分析？
            - 补救建议是否安全可行，是否包含免责声明？
            - 风险清单是否用"触发条件 → 典型表现 → 具体代价"格式，是否覆盖 6 个以上领域？
            - 验证问题是否可回答，是否区分时间窗口题与结构性题？
            - 风险清单中标注"与时间片触发相关"的风险，是否与前序基线证据一致？
            将审核结论写入 workspace/steps/natal/summary.checker.md。
          writer: |-
            基于已通过的 analyst 输出与 checker 结论，整理本命综合结论的可读稿。
            本步润色重点：这是全篇最重要的总结段落，语气需要更郑重、有分量感。
            风险清单润色要求：必须直白预警，不能用安慰性措辞掩盖风险。"触发条件 → 典型表现 → 具体代价"的结构可以口语化，但三要素不能缺。
            补救建议润色要求：保持实操性，免责声明必须保留。
            验证问题润色要求：转化为用户友好的提问方式，但问题本身不能变形。
            产出 workspace/steps/natal/summary.writer.md。
          checker_review: |-
            以模式 B 审查 writer 产出的 workspace/steps/natal/summary.writer.md，对照原稿 workspace/steps/natal/summary.md。
            本步差异化关注：
            - 风险清单是否完整保留（条数、严重程度、触发条件三要素）？风险不能被轻描淡写。
            - 免责声明是否保留？
            - 验证问题是否保持了原有的问题方向和意图？
            - 四大目标的结论方向是否与原稿一致？
      -
