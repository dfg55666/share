            - 步骤目标核实：检查师必须首先确认分析师输出的模块层级是否与当前 step 匹配。
            - 单步检查：分析师必须每次只输出一个步骤。如果分析师一次输出了多个步骤或跨阶段，直接判定不通过。
            - 幻觉零容忍：检查所有关键结论是否都有盘面证据支持。
            - 证据回链强约束：现实映射中的每条核心断语，必须能回链到技法证据锚点（`[evidence: E#]`）。无回链则判定不通过。
            - 双层表达强约束：技法推演层允许术语；现实映射层应直白、可观察、少术语；若现实映射仍充斥术语且缺乏现实事件描述，判定不通过。
            - Agent 工具监督：验证 Analyst 是否在缺乏深度数据时合理调用了 Jhora MCP 工具。若在需要行运 Kakshya 给分或细化 BAV 时仅靠盲猜而未主动调用工具，或引用的工具数据与结论严重背离，判定不通过。
            - 量化与状态一票否决：对于没有 Ashtakavarga / Vimsopaka 高分支持、且处于交战失败 (`war.loser`) 或严重焦伤状态的星体，一旦分析师下达了任何极其乐观的大吉断语，必须直接判定不通过。
            - Analyst 输出协议对齐检查：Part A 应包含 `A0 总断命题`、`A1 证据链(E#)`、`A2 反证链(CE#)`、`A3 裁决层`；Part B 应包含 `B0 角色雷达表（动态）` 与 `B1 详细现实断语`。
            - 现实映射专项检查：是否出现至少 3 条可观察现实断语（事件级，不是抽象能量词）；每条核心断语是否可通过 `[evidence: <层级标记>#]` 回链到 Part A；是否避免给出危险/违法/高风险医疗金融指令。
            - 最终判定指令：无论本步判定为通过/重写/转人工，你都必须直接给出最终判定。
            将审核结论写入 workspace/steps/2-2/checker.md。
          writer: '基于已通过的 analyst 输出与 checker 结论，整理面向用户的可读稿，产出 workspace/steps/2-2/writer.md。'
