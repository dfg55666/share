          analyst: |-
            本步为 PD 钻取条件占位步骤，仅在 AD 路由步骤（7-x-0）标记触发时才保留并执行。
            **执行时**：
            1. 读取 workspace/prompts/timeline/ad_prompt.md 中的 [PD钻取协议] 章节（触发条件、映射表规则、Part B 叙事格式）。
            2. 读取上一步 AD 分析产物（steps/timeline/{md-key}/ad_{ad-key}.md）中识别出的重大事件窗口。
            3. 调用 `jhora_dasha` 获取该 AD 内的 PD 序列，精确到 PD 起止日期。
            4. 钻取 PD 层时间节点，重点关注事件窗口内的关键 PD 触发点，给出可观察时间断语。
            产出 workspace/steps/timeline/{md-key}/pd_{ad-key}.md。
          checker: |-
            执行通用技术审查基线（checker_prompt §4），叠加以下专项检查（PD 钻取专项）：
            - PD 时间边界是否来自 `jhora_dasha` 真实数据，而非推算？
            - 是否聚焦在上游 AD 步骤识别出的事件窗口内，而非全面铺开 PD？
            - 时间断语是否可观察、可验证？
            - pd_map 是否与 pd_segments 计数一致？
            - 第一个 PD 段是否未被跳过？
            - 证据标记是否使用 PDE#？
            - Maraka + Lagna Lord 冲突 PD 是否自动标注为最高置信度？
            将审核结论写入 workspace/steps/timeline/{md-key}/pd_{ad-key}.checker.md。
          writer: |-
            基于已通过的 analyst 输出与 checker 结论，整理 PD 钻取可读稿。
            本步润色重点：PD 是最精确的时间层（精确到月），时间窗口的精度是生命线，绝对不能模糊化。
            去术语化重点：PD、Pratyantardasha 等概念不出现，用"关键月份"等口语替代。
            语气要求：精准、直接，像老友在帮你圈日历上的关键日期。
            产出 workspace/steps/timeline/{md-key}/pd_{ad-key}.writer.md。
          checker_review: |-
            以模式 B 审查 writer 产出的 workspace/steps/timeline/{md-key}/pd_{ad-key}.writer.md，对照原稿 workspace/steps/timeline/{md-key}/pd_{ad-key}.md。
            本步差异化关注（PD 钻取专项）：
            - 精确到月的时间窗口是否完整保留？这是 PD 层的最高红线。
            - 原稿中标注为 critical 的事件节点是否在口语稿中有同等力度的警示？
            - 可观察时间断语是否保持了具体性？
      -
        key: '7-1-z'
        title: '{MD主星} 大运聚合报告（占位，由 7-0 动态替换）'
        status: 'pending'
        description:
          analyst: |-
            本步为 MD 聚合报告占位步骤，由 7-0 替换为具体 MD 的聚合任务（如"木星大运聚合报告"）。
            **执行时**：
            1. 读取本 MD 所有已完成子步骤产物：
               - MD 总控：steps/timeline/{md-key}/md.md
               - 各 AD 分析：steps/timeline/{md-key}/ad_{ad-key}.md
               - 各 PD 钻取（如有）：steps/timeline/{md-key}/pd_{ad-key}.md
            2. 将以上内容整合为完整的 MD 聚合报告，格式如下：
               ```
               # {MD主星} 大运报告（{起止日期}）
               ## 大运总控与领域判断
               ## 子运详情
               ### AD：{AD主星}（{起止日期}）
               #### PD 钻取（若有）
               ### AD：...
               ```
            3. 若时间片证据推翻或细化了前序本命报告，允许回写 steps/natal/ 下相关文件，并在报告中说明改动。
            产出 workspace/steps/timeline/{md-key}/report.md（最终用户交付产物）。
          checker: |-
            执行通用技术审查基线（checker_prompt §4），叠加以下专项检查（MD 聚合报告专项）：
            - 是否完整整合了本 MD 下所有已完成的 AD/PD 子步骤产物，无遗漏？
            - 报告结构是否清晰（MD→AD→PD 层次分明）？
            - 若有回写前序报告，是否有清晰的时间证据与改动说明？
            - 各子步骤之间的结论是否一致？若有冲突须指出。
            - 聚合后的时间线是否连贯，无逻辑跳跃？
            将审核结论写入 workspace/steps/timeline/{md-key}/report.checker.md。
          writer: |-
            基于已通过的 analyst 输出与 checker 结论，整理该段 MD 完整聚合报告的可读稿。
            本步润色重点：这是用户最终阅读的完整大运报告，需要叙事流畅、结构清晰、前后衔接。
            时间线润色要求：所有时间窗口必须原样保留精度，各 AD 之间的时间衔接要自然。
            若时间片阶段已回写了前序报告，writer 必须按最新口径同步整理。
            语气要求：像一个老友帮你讲述未来几年的人生故事，有节奏感、有重点标注、有温度。
            产出 workspace/steps/timeline/{md-key}/report.writer.md。
          checker_review: |-
            以模式 B 审查 writer 产出的 workspace/steps/timeline/{md-key}/report.writer.md，对照原稿 workspace/steps/timeline/{md-key}/report.md。
            本步差异化关注（MD 聚合报告专项）：
            - 所有子步骤（AD/PD）的关键结论是否完整保留？
            - 时间线的精度和前后衔接是否完整？
            - 风险预警在聚合后是否仍有足够力度（不能在合并时被稀释）？
            - 若有回写前序报告的改动，口语稿是否同步反映了最新口径？
