        key: '7-0'
        title: '时间片总控与 Dasha 选择'
        status: 'pending'
        description:
          analyst: |-
            执行本步：时间片总控与 Dasha 选择。
            1. 调用 `jhora_dasha` 获取命主的 Dasha 序列，不得凭经验推算日期。
            2. **自主选择时间片**：基于 Dasha 数据与盘面判断，自主决定本次分析覆盖的 MD 范围与各 MD 内的 AD 范围，无需遵循固定规则，以"对命主最有分析价值"为唯一准则。
            3. **PD 规划**：PD 不是每个 AD 都钻取，此处仅标记"哪些 AD 可能触发 PD"，实际在 AD 步骤分析后由子任务路由步骤决定是否插入 PD 步骤。
            4. **通过 `task_update` 更新任务流**：为每段选定的 MD 插入一棵完整子任务树，结构如下：
               - `7-x`      MD 总控+领域分析（如 `7-1` 木星大运总控）
               - `7-x-0`    AD 路由步骤（分析完 MD 后，决定各 AD 的分析顺序与是否触发 PD）
               - `7-x-1`    第一个 AD 分析步骤
               - `7-x-1-0`  （条件）第一个 AD 的 PD 钻取步骤，仅在 `7-x-0` 路由时标记触发才插入
               - `7-x-2`    第二个 AD 分析步骤（及其可能的 PD 步骤，依此类推）
               - `7-x-z`    MD 聚合报告步骤（读取本 MD 所有子步骤产物，汇总为 report.md）
            5. 本步只负责 Dasha 读取、时间片选择与 task 子任务树规划，禁止展开任何领域分析内容。
            6. **分步调用 `task_update`**：每次只插入当前 MD 的子任务树，确认写入后再插入下一段 MD 的子任务树，不得一次性批量写入所有 MD 步骤。
            本步无需产出额外文件，`task_update` 对任务流的更新即为本步产物。
          checker: |-
            执行通用技术审查基线（checker_prompt §4），叠加以下专项检查：
            - 是否调用了 `jhora_dasha` 获取真实数据，而非凭空推算？
            - 是否给出了时间片选择的理由（为何选这几段 MD/AD）？
            - 是否为每段 MD 插入了完整子任务树（包含 MD总控、AD路由、AD分析、聚合报告各层）？
            - 是否真的通过 `task_update` 更新了任务流，而不只是在正文里描述计划？
            - 是否遵守了"分步调用"原则（逐个 MD 插入，非批量）？
