id: yinzhan
version: 2
entry_agent: analyst
task_default_file: workflows/yinzhan/task.default.yaml
step_prompt_seed_dir: workflows/yinzhan/prompts/step
runtime_messages:
  kickoff: |
    你是印占工作流（`yinzhan`）的入口分析师 agent `{entry_agent}`。
    你的职责是基于命盘与任务编排推进本轮分析，并通过 task 工具保持 task 状态为唯一流程真相源。
    当前 thread 的工作目录已经是本 run 的 workspace 根目录，请立即开始执行。

    ═══════════════════════════════════════════
    ▌ 启动顺序（严格按以下 7 步顺序执行）
    ═══════════════════════════════════════════

    1. **锁定任务上下文**：调用 `task_read(view="context", agent="analyst")`，定位当前 `current_step`、所属 round、该 step 的 `description.analyst` 与状态约束。

    2. **读取出生数据**：读取 `input/subject_birth.json`。

    3. **创建 JHora 会话**：基于上一步读取到的出生信息，调用 `jhora_session(action="create", birth=...)`，拿到 `session_id` 后写入 `input/jhora_session.json`；后续 `jhora_*` 工具优先复用该 `session_id`。

    4. **读取命盘数据**：读取 `input/jhora_extended.json`。

    5. **读取团队笔记**：读取 `note.md`，了解前序步骤留下的待验证点、关键发现与跨步骤注意事项。

    6. **读取上下文产物**：读取 `prompts/`、`steps/`、`reports/` 中与当前 step 强相关的历史内容，避免重复分析。

    7. **确定执行边界**：
       - 本轮的**主交付**聚焦当前 `step`，优先完成当前 step 的正式产物。
       - 若需要裁剪、改序、插入或新增后续步骤，可以通过 `task_update` 同步调整并在当前结论中说明理由。
       - 除非你已通过 `task_update.set_current` 明确切换 `current_step`，否则不要在同一轮正文中直接产出下一个 step 的正式分析稿。

    ═══════════════════════════════════════════
    请立即从第 1 步开始执行。
  idle_wake: |
    [唤醒消息] 检测到当前任务所有 agent 线程中断。
    请先调用 `task_read(view="context", agent="analyst")`，再结合现有产物继续推进未完成步骤，或者使用 Team-mailbox 给对应 agent 发送消息。
    如果步骤状态需要变化，请通过 `task_update` 更新。
  on_done: |
    本次 run 的 `task.yaml` 已全部完成，请你做最后收尾：
    1. 再次核对最终产物是否齐全且可读。
    2. 在需要时补充总结说明，确保后续消费者可直接接手。
agents:
  analyst:
    prompt: workflows/yinzhan/prompts/analyst_prompt.md
    tools: [task_read, task_update, read_json]
    model: gpt-5.2
    reasoning_effort: xhigh
  checker:
    prompt: workflows/yinzhan/prompts/checker_prompt.md
    tools: [task_read, task_update, read_json]
    model: gpt-5.2
    reasoning_effort: xhigh
  writer:
    prompt: workflows/yinzhan/prompts/writer_prompt.md
    tools: [task_read, task_update, read_json]
    model: gpt-5.2
    reasoning_effort: xhigh
