<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NodeOps Helper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <div class="header">
        <h1>NodeOps Helper</h1>
      </div>

      <div class="card">
        <button id="resetCreditsBtn" class="btn-primary" type="button">
          ⚡ 一键重置额度
        </button>
        <p class="hint">清理登录态 → 自动登录 → 验证码填入 → 兑换 200 积分</p>
      </div>

      <div class="divider"></div>

      <div class="card">
        <label class="label" for="chatMsgInput">发送消息</label>
        <textarea id="chatMsgInput" rows="4" placeholder="输入要发送的消息..."></textarea>
        <button id="sendChatBtn" class="btn-secondary" type="button">
          发送 ↵
        </button>
      </div>

      <pre id="status">等待执行</pre>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
